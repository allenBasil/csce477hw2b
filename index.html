<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login System</title>
</head>
<body>
    <div id="greeting"></div>
    <h2>Login</h2>
    <form id="loginForm" action="http://localhost:3000/login" method="POST">
        <label for="email">Email:</label>
        <input type="text" id="email" name="email"><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        
        <button type="submit">Login</button>
    </form>
    <p id="errorMsg" style="color:red;"></p>

    <script>
        // Vulnerable greeting feature for Part 3 testing
        const urlParams = new URLSearchParams(window.location.search);
        const user = urlParams.get('user');
        if (user) {
            document.getElementById('greeting').innerHTML = "Welcome, " + user + "!";
        }

        // Client-side validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!email || !password) {
                e.preventDefault();
                errorMsg.textContent = "Fields cannot be empty.";
                return;
            }
            if (!email.includes('@')) {
                e.preventDefault();
                errorMsg.textContent = "Email must contain '@'.";
                return;
            }
            if (password.length < 8) {
                e.preventDefault();
                errorMsg.textContent = "Password must be at least 8 characters.";
                return;
            }
            errorMsg.textContent = "";
        });
    </script>
</body>
</html>
